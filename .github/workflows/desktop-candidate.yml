name: Desktop candidate regression

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  packaged:
    # This job has no private build credentials. Maintainers separately export
    # reviewed candidates into a private draft; missing/exact-SHA assets fail.
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'desktop-validation')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Download separately prepared exact candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          gh release download "qa-desktop-$CANDIDATE_SHA" --dir artifacts --pattern "Blast-Circuit-$TARGET*" --pattern 'Blast-Circuit-server-dotnet10*' --pattern server-build-metadata.json
          python -c 'import json,os; m=json.load(open("artifacts/Blast-Circuit-"+os.environ["TARGET"]+"-metadata.json")); assert m["revision"]==os.environ["CANDIDATE_SHA"], "Candidate source mismatch"'
      - if: runner.os == 'Windows'
        run: python tools/packaging/package-download.py --target windows-x64
      - run: dotnet run --project tests/Bomber.DesktopUpdate.Tests -m:1
      - name: Full packaged gameplay and multiplayer regression
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/packaging/verify-desktop.py --target "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-${{ matrix.target }}
          path: |
            artifacts/*-smoke.json
            artifacts/*-Setup.exe
            artifacts/*-Setup.exe.sha256
            artifacts/*-download.json
            artifacts/*-regression-details/**/summary.json
            artifacts/*-regression-details/**/runner-summary.json
            artifacts/*-regression-details/**/junit.xml
            artifacts/*-regression-details/**/runtime.log
            artifacts/*-regression-details/**/failure.png
          retention-days: 14
          if-no-files-found: warn
