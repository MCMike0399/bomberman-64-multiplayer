name: Desktop candidate regression

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  candidate-assets:
    # Draft release visibility requires contents:write. Keep that permission on
    # a disposable download-only runner that never checks out or runs PR code.
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'desktop-validation')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download separately prepared exact-source candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh release download "qa-desktop-$CANDIDATE_SHA" --dir artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-candidate-inputs
          path: artifacts
          retention-days: 2
          if-no-files-found: error

  packaged:
    needs: candidate-assets
    # This job has no private build credentials. Maintainers separately export
    # reviewed candidates into a private draft; missing/exact-SHA assets fail.
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'desktop-validation')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            timeout: 60
          - target: linux-x64
            runner: ubuntu-24.04
            timeout: 210
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-candidate-inputs
          path: artifacts
      - name: Verify the compiled candidate source identity
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python -c 'import json,os; m=json.load(open("artifacts/Blast-Circuit-"+os.environ["TARGET"]+"-metadata.json")); assert m["revision"]==os.environ["CANDIDATE_SHA"], "Candidate source mismatch"'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools fuse3 libicu74 xvfb openbox pulseaudio mesa-vulkan-drivers
      - if: runner.os == 'Windows'
        run: ./tools/packaging/windows-test-desktop.ps1
      - if: runner.os == 'Windows'
        run: python tools/packaging/package-download.py --target windows-x64
      - if: runner.os == 'Linux'
        run: python3 tools/packaging/package-download.py --target linux-x64
      - run: |
          dotnet build tests/Bomber.DesktopUpdate.Tests --nologo -m:1
          dotnet run --no-build --project tests/Bomber.DesktopUpdate.Tests
      - name: Unpack the deliberately newer real-game updater fixture
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/packaging/package-update-fixture.py --target "$TARGET" --unpack
      - name: Full packaged gameplay and multiplayer regression
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/packaging/verify-desktop.py --target "$TARGET"
      - name: Actual signed game update and rollback
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if [ "$TARGET" = linux-x64 ]; then
            python tools/packaging/package-download.py --target "$TARGET" --directory artifacts/update-fixture
            python tools/packaging/linux-desktop.py -- python tools/packaging/verify-desktop-update.py --target "$TARGET"
          else
            python tools/packaging/verify-desktop-update.py --target "$TARGET"
          fi
      - name: Full native-renderer gameplay and saved-startup regression
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if [ "$TARGET" = linux-x64 ]; then
            python tools/packaging/linux-desktop.py -- python tools/packaging/startup-desktop.py --target "$TARGET"
            python tools/packaging/linux-desktop.py -- python tools/packaging/verify-desktop.py --target "$TARGET" --graphical --software-renderer
          else
            python tools/packaging/startup-desktop.py --target "$TARGET"
            python tools/packaging/verify-desktop.py --target "$TARGET" --graphical
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-${{ matrix.target }}
          path: |
            artifacts/*-smoke.json
            artifacts/*-graphical.json
            artifacts/*-startup.json
            artifacts/windows-audio/*.json
            artifacts/*-startup-details/**/runtime.log
            artifacts/*-startup-details/**/*.png
            artifacts/*-updater-tests.json
            artifacts/*-updater-details/**/runtime.log
            artifacts/*-updater-details/**/summary.json
            artifacts/*-updater-details/**/old-launch.log
            artifacts/*-updater-details/**/restored-gameplay.log
            artifacts/*-updater-details/**/helper-error.txt
            artifacts/*-updater-details/**/setup.log
            artifacts/*-updater-details/**/health.json
            artifacts/*-Setup.exe
            artifacts/*-Setup.exe.sha256
            artifacts/*-download.json
            artifacts/*-regression-details/**/summary.json
            artifacts/*-regression-details/**/runner-summary.json
            artifacts/*-regression-details/**/peer-capacity-diagnostics.json
            artifacts/*-regression-details/**/display-restart.json
            artifacts/*-regression-details/**/junit.xml
            artifacts/*-regression-details/**/runtime.log
            artifacts/*-regression-details/**/*.png
          retention-days: 14
          if-no-files-found: warn

  mac-regression:
    name: Packaged Mac regression
    needs: candidate-assets
    runs-on: macos-15
    # Full archived tour (40 min), separate updater transactions, setup/upload.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-candidate-inputs
          path: artifacts
      - run: python3 tools/packaging/macos-test-display.py
      - run: python3 tools/packaging/verify-mac-archive.py
      # Keep long-running platform QA independent of new Mac stable releases.
      # This explicit baseline is diagnostic; trusted main still tests latest.
      - name: Actual signed Mac update from the pinned QA baseline (v0.43.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -x -k artifacts/Blast-Circuit-macos-arm64.zip "$RUNNER_TEMP/mac-update-candidate"
          python3 tools/ci/update_from_published.py --previous-version 0.43.0 --app "$RUNNER_TEMP/mac-update-candidate/Blast Circuit.app" --output artifacts/candidate-mac-update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candidate-macos-arm64
          path: |
            artifacts/Blast-Circuit-macos-arm64-regression.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/summary.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/runner-summary.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/progress.json
            artifacts/*-regression-details/**/peer-capacity-diagnostics.json
            artifacts/*-regression-details/**/display-restart.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/runtime.log
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/*.png
            artifacts/candidate-mac-update/summary.json
          retention-days: 14
          if-no-files-found: warn

  crossplay:
    name: Cross-platform Quick Play
    needs: [packaged, mac-regression]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/crossplay.yml
    with:
      mode: candidate
      revision: ${{ github.event.pull_request.head.sha }}
