name: Release verified game

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    secrets:
      BLAST_UPDATE_SIGNING_KEY:
        required: true
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Verification run ID
        type: string
        required: true
      publish:
        description: Deploy the matching server, verify all targets, then publish
        type: boolean
        default: false
      version:
        description: Version from Release.props
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: blast-release-promotion
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.run.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          VERSION: ${{ inputs.version }}
        run: python3 tools/ci/promote_release.py --check-only --run-id "$RUN_ID" --version "$VERSION"

  deploy:
    needs: validate
    if: inputs.publish
    environment: production
    runs-on: [self-hosted, blast-deploy]
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.revision }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Deploy checked artifacts and verify every node
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ needs.validate.outputs.revision }}
          BLAST_DEPLOY_ADAPTER: ${{ vars.BLAST_DEPLOY_ADAPTER }}
          BLAST_DEPLOY_STATE_DIR: ${{ vars.BLAST_DEPLOY_STATE_DIR }}
          BLAST_RELEASE_SERVER_URLS: ${{ vars.BLAST_RELEASE_SERVER_URLS }}
          BLAST_RELEASE_PLACEMENTS: ${{ vars.BLAST_RELEASE_PLACEMENTS }}
          BLAST_UPDATE_SIGNING_KEY: ${{ secrets.BLAST_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp "$RUNNER_TEMP/blast-update-signing.XXXXXX")
          trap 'rm -f "$key"' EXIT
          test -n "$BLAST_UPDATE_SIGNING_KEY"
          printf '%s\n' "$BLAST_UPDATE_SIGNING_KEY" > "$key"
          python3 tools/ci/deploy_release.py --run-id "$RUN_ID" --version "$VERSION" \
            --expected-sha "$EXPECTED_SHA" --adapter "$BLAST_DEPLOY_ADAPTER" \
            --signing-key "$key" --state-dir "$BLAST_DEPLOY_STATE_DIR" --output artifacts/deployment-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-receipt
          path: artifacts/deployment-receipt.json
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: [validate, deploy]
    if: >-
      always() && needs.validate.result == 'success' &&
      ((!inputs.publish && needs.deploy.result == 'skipped') ||
       (inputs.publish && needs.deploy.result == 'success'))
    environment: production
    runs-on: ${{ inputs.publish && fromJSON('["self-hosted","blast-deploy"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.revision }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: inputs.publish
        with:
          dotnet-version: 10.0.x
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ needs.validate.outputs.revision }}
          BLAST_UPDATE_SIGNING_KEY: ${{ secrets.BLAST_UPDATE_SIGNING_KEY }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          BLAST_RELEASE_SERVER_URLS: ${{ vars.BLAST_RELEASE_SERVER_URLS }}
          BLAST_RELEASE_PLACEMENTS: ${{ vars.BLAST_RELEASE_PLACEMENTS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/blast-update-signing.pem"
          trap 'rm -f "$key"' EXIT
          test -n "$BLAST_UPDATE_SIGNING_KEY"
          printf '%s\n' "$BLAST_UPDATE_SIGNING_KEY" > "$key"
          args=(--run-id "$RUN_ID" --version "$VERSION" --expected-sha "$EXPECTED_SHA" --signing-key "$key")
          if [[ "$PUBLISH_RELEASE" == true ]]; then args+=(--publish); fi
          python3 tools/ci/promote_release.py "${args[@]}"
