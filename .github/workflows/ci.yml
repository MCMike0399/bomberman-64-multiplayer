name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    name: Public contracts and audio
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select verification scope (unknown history requires every lane)
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 tools/ci/verification_scope.py --base "$BASE_SHA"
      - name: Validate release and verification workflows
        run: |
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yml
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: python3 tools/qa/run.py --profile public
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn
      - name: Describe verification coverage
        if: always()
        env:
          PRIVATE_ENABLED: ${{ vars.KERNEL_CI_ENABLED }}
          GRAPHICAL_ENABLED: ${{ vars.MACOS_QA_ENABLED }}
        run: |
          {
            echo '### Verification capabilities'
            echo 'Public checks run without the private dependency on every PR.'
            echo "Trusted private build enabled: ${PRIVATE_ENABLED:-false}."
            echo "Metal graphical runner enabled: ${GRAPHICAL_ENABLED:-false}."
            echo 'Private functional builds run only for same-repository PRs or main. Fork PRs and self-hosted graphical PR jobs remain excluded.'
          } >> "$GITHUB_STEP_SUMMARY"

  managed:
    name: Trusted managed and network
    needs: public
    if: >-
      needs.public.outputs.runtime == 'true' && vars.KERNEL_CI_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/qa/run.py --profile managed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          path: |
            artifacts/Blast-Circuit-server-dotnet10.zip
            artifacts/Blast-Circuit-server-dotnet10.zip.sha256
            artifacts/server-build-metadata.json
          retention-days: 14
          if-no-files-found: error
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: managed-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn

  headless:
    name: Trusted Godot headless
    needs: public
    if: >-
      needs.public.outputs.runtime == 'true' && vars.KERNEL_CI_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/ci/install_godot.py --destination "$RUNNER_TEMP/godot"
      - run: python3 tools/qa/run.py --profile headless
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: headless-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn

  graphical:
    name: Trusted macOS Metal journey
    needs: public
    if: needs.public.outputs.runtime == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true' && vars.MACOS_QA_ENABLED == 'true'
    runs-on: [self-hosted, macOS, ARM64, blast-metal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/qa/run.py --profile graphical --desktop shared
        env:
          GODOT: /Applications/Godot_mono.app/Contents/MacOS/Godot
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: metal-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Trusted Apple Silicon package
    # Runs beside managed/headless; promotion still requires every trusted job to pass.
    needs: public
    if: >-
      needs.public.outputs.runtime == 'true' && vars.KERNEL_CI_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/ci/install_godot.py --destination "$RUNNER_TEMP/godot" --templates
      - name: Identify controller toolchain
        id: controller-toolchain
        run: echo "sdk=$(xcrun --show-sdk-version)" >> "$GITHUB_OUTPUT"
      - name: Reuse public controller libraries (never private game outputs)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/macos/libSDL3.dylib
            native/macos/libusb-1.0.dylib
            native/macos/SDL-LICENSE.txt
            native/macos/libusb-LICENSE.txt
          key: controllers-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.controller-toolchain.outputs.sdk }}-${{ hashFiles('tools/controllers/**') }}
      - run: python3 tools/qa/run.py --profile package
      - name: Archive tested app preserving permissions and symlinks
        working-directory: artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent "exports/Blast Circuit.app" Blast-Circuit-macos-arm64.zip
          shasum -a 256 Blast-Circuit-macos-arm64.zip > Blast-Circuit-macos-arm64.zip.sha256
      - name: Record artifact source and bundle identity
        run: python3 tools/ci/package_metadata.py
      - run: python3 tools/packaging/package-download.py --target macos-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-macos-arm64-ad-hoc
          path: |
            artifacts/Blast-Circuit-macos-arm64.zip
            artifacts/Blast-Circuit-macos-arm64.zip.sha256
            artifacts/build-metadata.json
            artifacts/render-fingerprint.json
            artifacts/Blast-Circuit-macos-arm64.dmg
            artifacts/Blast-Circuit-macos-arm64.dmg.sha256
            artifacts/Blast-Circuit-macos-arm64-download.json
          retention-days: 14
          if-no-files-found: error
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn

  # Release gates launch the archived bytes players receive on a hosted macOS VM's
  # real Metal renderer, in parallel. Deployment and publication require both
  # jobs and re-validate their receipts (tools/ci/release_gates.py).
  startup-gate:
    name: 'Release gate: saved-settings startup'
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-macos-arm64-ad-hoc
          path: artifacts
      - name: Extract the exact tested archive
        working-directory: artifacts
        run: |
          shasum -a 256 -c Blast-Circuit-macos-arm64.zip.sha256
          ditto -x -k Blast-Circuit-macos-arm64.zip "$RUNNER_TEMP/candidate"
      - name: Launch every saved graphics preset and display mode
        run: python3 tools/qa/startup_gate.py --app "$RUNNER_TEMP/candidate/Blast Circuit.app" --output artifacts/release-gate-startup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-gate-startup
          path: |
            artifacts/release-gate-startup/summary.json
            artifacts/release-gate-startup/*/*.png
          retention-days: 14
          if-no-files-found: warn

  update-gate:
    name: 'Release gate: update from published'
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-macos-arm64-ad-hoc
          path: artifacts
      - name: Extract the exact tested archive
        working-directory: artifacts
        run: |
          shasum -a 256 -c Blast-Circuit-macos-arm64.zip.sha256
          ditto -x -k Blast-Circuit-macos-arm64.zip "$RUNNER_TEMP/candidate"
      - name: Update the latest published app to this candidate (install, rollback, saved High/fullscreen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/update_from_published.py --app "$RUNNER_TEMP/candidate/Blast Circuit.app" --output artifacts/release-gate-update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-gate-update
          path: |
            artifacts/release-gate-update/summary.json
            artifacts/release-gate-update/attempt-*/transactions/summary.json
          retention-days: 14
          if-no-files-found: warn


  windows-package:
    name: Trusted windows-x64 package
    needs: public
    if: >-
      needs.public.outputs.runtime == 'true' && vars.KERNEL_CI_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/ci/install_godot.py --destination "$RUNNER_TEMP/godot" --templates
      - run: python3 tools/packaging/package-desktop.py --target windows-x64
      - run: python3 tools/packaging/package-update-fixture.py --target windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-windows-x64
          path: |
            artifacts/Blast-Circuit-windows-x64.zip
            artifacts/Blast-Circuit-windows-x64.zip.sha256
            artifacts/Blast-Circuit-windows-x64-metadata.json
            artifacts/Blast-Circuit-windows-x64-update-fixture.zip
            artifacts/Blast-Circuit-windows-x64-update-fixture.zip.sha256
          retention-days: 14
          if-no-files-found: error

  linux-package:
    name: Trusted linux-x64 package
    needs: public
    if: >-
      needs.public.outputs.runtime == 'true' && vars.KERNEL_CI_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/ci/install_godot.py --destination "$RUNNER_TEMP/godot" --templates
      - run: python3 tools/packaging/package-desktop.py --target linux-x64
      - run: python3 tools/packaging/package-update-fixture.py --target linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-linux-x64
          path: |
            artifacts/Blast-Circuit-linux-x64.zip
            artifacts/Blast-Circuit-linux-x64.zip.sha256
            artifacts/Blast-Circuit-linux-x64-metadata.json
            artifacts/Blast-Circuit-linux-x64-update-fixture.zip
            artifacts/Blast-Circuit-linux-x64-update-fixture.zip.sha256
          retention-days: 14
          if-no-files-found: error

  desktop-download:
    name: Trusted ${{ matrix.target }} download
    needs: [windows-package, linux-package]
    # Build each player download once; native parts and publication use these bytes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-${{ matrix.target }}
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          path: artifacts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools fuse3
      - env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/packaging/package-download.py --target "$TARGET"
      - id: plan
        shell: bash
        run: echo "plan=$(python tools/ci/desktop_validation.py windows-x64 linux-x64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-${{ matrix.target }}-download
          path: |
            artifacts/Blast-Circuit-${{ matrix.target }}-Setup.exe
            artifacts/Blast-Circuit-${{ matrix.target }}-Setup.exe.sha256
            artifacts/Blast-Circuit-${{ matrix.target }}.AppImage
            artifacts/Blast-Circuit-${{ matrix.target }}.AppImage.sha256
            artifacts/Blast-Circuit-${{ matrix.target }}-download.json
          retention-days: 14
          if-no-files-found: error

  desktop-native:
    name: Exported ${{ matrix.target }} native checks
    needs: [desktop-download, managed]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      BLAST_QA_WINDOWS_DRIVER: ${{ matrix.target == 'windows-x64' && 'd3d12' || '' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-${{ matrix.target }}
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-${{ matrix.target }}-download
          path: artifacts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools fuse3 xvfb openbox pulseaudio mesa-vulkan-drivers
      - if: runner.os == 'Windows'
        run: ./tools/packaging/windows-test-desktop.ps1
      - run: |
          dotnet build tests/Bomber.DesktopUpdate.Tests --nologo -m:1
          dotnet run --no-build --project tests/Bomber.DesktopUpdate.Tests
      - env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/packaging/verify-desktop.py --target "$TARGET"
      - env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/packaging/package-update-fixture.py --target "$TARGET" --unpack
      - env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if [ "$TARGET" = linux-x64 ]; then
            python tools/packaging/package-download.py --target "$TARGET" --directory artifacts/update-fixture
            python tools/packaging/linux-desktop.py -- python tools/packaging/verify-desktop-update.py --target "$TARGET"
            python tools/packaging/linux-desktop.py -- python tools/packaging/startup-desktop.py --target "$TARGET"
          else
            python tools/packaging/verify-desktop-update.py --target "$TARGET"
            python tools/ci/startup_guard.py --expected-revision "$GITHUB_SHA" --output artifacts/windows-startup-guard
            python tools/packaging/startup-desktop.py --target "$TARGET"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Blast-Circuit-${{ matrix.target }}-native
          path: |
            artifacts/Blast-Circuit-${{ matrix.target }}-smoke.json
            artifacts/Blast-Circuit-${{ matrix.target }}-startup*.json
            artifacts/windows-startup-guard/
            artifacts/windows-audio/*.json
            artifacts/*-startup-details/**/runtime.log
            artifacts/*-startup-details/**/*.png
            artifacts/*-updater-tests.json
            artifacts/*-updater-details/**/runtime.log
            artifacts/*-updater-details/**/summary.json
            artifacts/*-updater-details/**/old-launch.log
            artifacts/*-updater-details/**/restored-gameplay.log
            artifacts/*-updater-details/**/helper-error.txt
            artifacts/*-updater-details/**/setup.log
            artifacts/*-updater-details/**/health.json
            artifacts/*-regression-details/**/summary.json
            artifacts/*-regression-details/**/runner-summary.json
            artifacts/*-regression-details/**/progress.json
            artifacts/*-regression-details/**/peer-capacity-diagnostics.json
            artifacts/*-regression-details/**/peer-room-diagnostics.json
            artifacts/*-regression-details/**/network-diagnostics.json
            artifacts/*-regression-details/server*.log
            artifacts/*-regression-details/**/junit.xml
            artifacts/*-regression-details/**/runtime.log
          retention-days: 14
          if-no-files-found: warn

  desktop-smoke:
    name: Exported ${{ matrix.target }} smoke
    needs: [desktop-download, desktop-native]
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x64, linux-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-${{ matrix.target }}
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-${{ matrix.target }}-download
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-${{ matrix.target }}-native
          path: artifacts
      - env:
          TARGET: ${{ matrix.target }}
        run: python3 -c 'import os,sys;from pathlib import Path;sys.path.insert(0,"tools/ci");import desktop_packages,release_identity;desktop_packages.inspect(Path("artifacts"),os.environ["GITHUB_SHA"],release_identity.check_exports(),targets=[os.environ["TARGET"]],include_graphics=False)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-${{ matrix.target }}-smoke
          path: |
            artifacts/Blast-Circuit-${{ matrix.target }}-smoke.json
            artifacts/Blast-Circuit-${{ matrix.target }}-graphical.json
            artifacts/Blast-Circuit-${{ matrix.target }}-graphical-part-*.json
            artifacts/Blast-Circuit-${{ matrix.target }}-startup*.json
            artifacts/windows-audio/*.json
            artifacts/*-startup-details/**/runtime.log
            artifacts/*-startup-details/**/*.png
            artifacts/*-updater-tests.json
            artifacts/*-updater-details/**/runtime.log
            artifacts/*-updater-details/**/summary.json
            artifacts/*-updater-details/**/old-launch.log
            artifacts/*-updater-details/**/restored-gameplay.log
            artifacts/*-updater-details/**/helper-error.txt
            artifacts/*-updater-details/**/setup.log
            artifacts/*-updater-details/**/health.json
            artifacts/Blast-Circuit-${{ matrix.target }}-Setup.exe
            artifacts/Blast-Circuit-${{ matrix.target }}-Setup.exe.sha256
            artifacts/Blast-Circuit-${{ matrix.target }}.AppImage
            artifacts/Blast-Circuit-${{ matrix.target }}.AppImage.sha256
            artifacts/Blast-Circuit-${{ matrix.target }}-download.json
            artifacts/*-regression-details/**/summary.json
            artifacts/*-regression-details/**/runner-summary.json
            artifacts/*-regression-details/**/graphics-preparation.json
            artifacts/*-regression-details/**/progress.json
            artifacts/*-regression-details/**/peer-capacity-diagnostics.json
            artifacts/*-regression-details/**/display-restart.json
            artifacts/*-regression-details/**/peer-room-diagnostics.json
            artifacts/*-regression-details/**/network-diagnostics.json
            artifacts/*-regression-details/**/leaf-memory.json
            artifacts/*-regression-details/server*.log
            artifacts/*-regression-details/**/junit.xml
            artifacts/*-regression-details/**/runtime.log
            artifacts/*-regression-details/**/*.png
          retention-days: 14
          if-no-files-found: error

  mac-regression:
    name: Exported macos-arm64 regression
    needs: [package, managed]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-macos-arm64-ad-hoc
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          path: artifacts
      - run: python3 tools/packaging/macos-test-display.py
      - name: Verify installed Mac functional journeys; full graphical tour stays main-only
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=()
          if [ "$EVENT_NAME" = pull_request ]; then args+=(--functional-only); fi
          python3 tools/packaging/verify-mac-archive.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Blast-Circuit-macos-arm64-regression
          path: |
            artifacts/Blast-Circuit-macos-arm64-regression.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/summary.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/runner-summary.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/progress.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/graphics-preparation.json
            artifacts/*-regression-details/**/peer-capacity-diagnostics.json
            artifacts/*-regression-details/**/display-restart.json
            artifacts/*-regression-details/**/peer-room-diagnostics.json
            artifacts/*-regression-details/**/network-diagnostics.json
            artifacts/*-regression-details/**/leaf-memory.json
            artifacts/*-regression-details/server*.log
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/runtime.log
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/*.png
          retention-days: 14
          if-no-files-found: warn

  crossplay:
    name: Cross-platform Quick Play
    needs: [desktop-smoke, mac-regression]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/crossplay.yml
    with:
      mode: verification
      revision: ${{ github.sha }}
