name: Frozen Windows peer ordering observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-windows-peer-order-v0451
  cancel-in-progress: false
jobs:
  observe:
    name: Fixed nonqualifying frozen-payload batch
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: ./tools/packaging/windows-test-desktop.ps1
      - name: Measure all ten fixed cells without retries or product changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/windows_peer_observation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-windows-peer-order-observation
          path: artifacts/peer-order-observation
          if-no-files-found: error
          retention-days: 30
