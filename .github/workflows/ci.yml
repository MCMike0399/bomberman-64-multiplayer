name: Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    name: Public contracts and audio
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select verification scope (unknown history requires every lane)
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 tools/ci/verification_scope.py --base "$BASE_SHA"
      - name: Validate release and verification workflows
        run: |
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yml
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: python3 tools/qa/run.py --profile public
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn
      - name: Describe verification coverage
        if: always()
        env:
          PRIVATE_ENABLED: ${{ vars.KERNEL_CI_ENABLED }}
          GRAPHICAL_ENABLED: ${{ vars.MACOS_QA_ENABLED }}
        run: |
          {
            echo '### Verification capabilities'
            echo 'Public checks run without the private dependency on every PR.'
            echo "Trusted private build enabled: ${PRIVATE_ENABLED:-false}."
            echo "Metal graphical runner enabled: ${GRAPHICAL_ENABLED:-false}."
            echo 'Private builds and graphical checks never execute PR code. See docs/ci.md for setup and coverage limits.'
          } >> "$GITHUB_STEP_SUMMARY"

  managed:
    name: Trusted managed and network
    needs: public
    if: needs.public.outputs.runtime == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/qa/run.py --profile managed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          path: |
            artifacts/Blast-Circuit-server-dotnet10.zip
            artifacts/Blast-Circuit-server-dotnet10.zip.sha256
            artifacts/server-build-metadata.json
          retention-days: 14
          if-no-files-found: error
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: managed-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn

  headless:
    name: Trusted Godot headless
    needs: public
    if: needs.public.outputs.runtime == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/ci/install_godot.py --destination "$RUNNER_TEMP/godot"
      - run: python3 tools/qa/run.py --profile headless
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: headless-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn

  graphical:
    name: Trusted macOS Metal journey
    needs: public
    if: needs.public.outputs.runtime == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true' && vars.MACOS_QA_ENABLED == 'true'
    runs-on: [self-hosted, macOS, ARM64, blast-metal]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/qa/run.py --profile graphical --desktop shared
        env:
          GODOT: /Applications/Godot_mono.app/Contents/MacOS/Godot
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: metal-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Trusted Apple Silicon package
    # Runs beside managed/headless; promotion still requires every trusted job to pass.
    needs: public
    if: needs.public.outputs.runtime == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/ci/install_godot.py --destination "$RUNNER_TEMP/godot" --templates
      - name: Identify controller toolchain
        id: controller-toolchain
        run: echo "sdk=$(xcrun --show-sdk-version)" >> "$GITHUB_OUTPUT"
      - name: Reuse public controller libraries (never private game outputs)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/macos/libSDL3.dylib
            native/macos/libusb-1.0.dylib
            native/macos/SDL-LICENSE.txt
            native/macos/libusb-LICENSE.txt
          key: controllers-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.controller-toolchain.outputs.sdk }}-${{ hashFiles('tools/controllers/**') }}
      - run: python3 tools/qa/run.py --profile package
      - name: Archive tested app preserving permissions and symlinks
        working-directory: artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent "exports/Blast Circuit.app" Blast-Circuit-macos-arm64.zip
          shasum -a 256 Blast-Circuit-macos-arm64.zip > Blast-Circuit-macos-arm64.zip.sha256
      - name: Record artifact source and bundle identity
        run: python3 tools/ci/package_metadata.py
      - run: python3 tools/packaging/package-download.py --target macos-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-macos-arm64-ad-hoc
          path: |
            artifacts/Blast-Circuit-macos-arm64.zip
            artifacts/Blast-Circuit-macos-arm64.zip.sha256
            artifacts/build-metadata.json
            artifacts/Blast-Circuit-macos-arm64.dmg
            artifacts/Blast-Circuit-macos-arm64.dmg.sha256
            artifacts/Blast-Circuit-macos-arm64-download.json
          retention-days: 14
          if-no-files-found: error
      - if: always()
        run: python3 tools/ci/stage_reports.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-receipts
          path: artifacts/ci-reports
          retention-days: 7
          if-no-files-found: warn

  # Release gates launch the archived bytes players receive on a hosted macOS VM's
  # real Metal renderer, in parallel. Deployment and publication require both
  # jobs and re-validate their receipts (tools/ci/release_gates.py).
  startup-gate:
    name: 'Release gate: saved-settings startup'
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-macos-arm64-ad-hoc
          path: artifacts
      - name: Extract the exact tested archive
        working-directory: artifacts
        run: |
          shasum -a 256 -c Blast-Circuit-macos-arm64.zip.sha256
          ditto -x -k Blast-Circuit-macos-arm64.zip "$RUNNER_TEMP/candidate"
      - name: Launch every saved graphics preset and display mode
        run: python3 tools/qa/startup_gate.py --app "$RUNNER_TEMP/candidate/Blast Circuit.app" --output artifacts/release-gate-startup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-gate-startup
          path: |
            artifacts/release-gate-startup/summary.json
            artifacts/release-gate-startup/*/*.png
          retention-days: 14
          if-no-files-found: warn

  update-gate:
    name: 'Release gate: update from published'
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-macos-arm64-ad-hoc
          path: artifacts
      - name: Extract the exact tested archive
        working-directory: artifacts
        run: |
          shasum -a 256 -c Blast-Circuit-macos-arm64.zip.sha256
          ditto -x -k Blast-Circuit-macos-arm64.zip "$RUNNER_TEMP/candidate"
      - name: Update the latest published app to this candidate (install, rollback, saved High/fullscreen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/update_from_published.py --app "$RUNNER_TEMP/candidate/Blast Circuit.app" --output artifacts/release-gate-update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-gate-update
          path: |
            artifacts/release-gate-update/summary.json
            artifacts/release-gate-update/attempt-*/transactions/summary.json
          retention-days: 14
          if-no-files-found: warn


  windows-package:
    name: Trusted windows-x64 package
    needs: public
    if: needs.public.outputs.runtime == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/ci/install_godot.py --destination "$RUNNER_TEMP/godot" --templates
      - run: python3 tools/packaging/package-desktop.py --target windows-x64
      - run: python3 tools/packaging/package-update-fixture.py --target windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-windows-x64
          path: |
            artifacts/Blast-Circuit-windows-x64.zip
            artifacts/Blast-Circuit-windows-x64.zip.sha256
            artifacts/Blast-Circuit-windows-x64-metadata.json
            artifacts/Blast-Circuit-windows-x64-update-fixture.zip
            artifacts/Blast-Circuit-windows-x64-update-fixture.zip.sha256
          retention-days: 14
          if-no-files-found: error

  windows-smoke:
    name: Exported windows-x64 smoke
    needs: [windows-package, managed]
    runs-on: windows-2025
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-windows-x64
          path: artifacts
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          path: artifacts
      - run: ./tools/packaging/windows-test-desktop.ps1
      - run: python tools/packaging/package-download.py --target windows-x64
      - run: |
          dotnet build tests/Bomber.DesktopUpdate.Tests --nologo -m:1
          dotnet run --no-build --project tests/Bomber.DesktopUpdate.Tests
      - run: python tools/packaging/verify-desktop.py --target windows-x64
      - run: python tools/packaging/package-update-fixture.py --target windows-x64 --unpack
      - run: python tools/packaging/verify-desktop-update.py --target windows-x64
      - run: python tools/packaging/startup-desktop.py --target windows-x64
      - run: python tools/packaging/verify-desktop.py --target windows-x64 --graphical --software-renderer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Blast-Circuit-windows-x64-smoke
          path: |
            artifacts/Blast-Circuit-windows-x64-smoke.json
            artifacts/Blast-Circuit-windows-x64-graphical.json
            artifacts/Blast-Circuit-windows-x64-startup.json
            artifacts/windows-audio/*.json
            artifacts/Blast-Circuit-windows-x64-startup-details/**/runtime.log
            artifacts/Blast-Circuit-windows-x64-startup-details/**/*.png
            artifacts/Blast-Circuit-windows-x64-updater-tests.json
            artifacts/Blast-Circuit-windows-x64-updater-details/**/runtime.log
            artifacts/Blast-Circuit-windows-x64-updater-details/**/summary.json
            artifacts/Blast-Circuit-windows-x64-updater-details/**/old-launch.log
            artifacts/Blast-Circuit-windows-x64-updater-details/**/restored-gameplay.log
            artifacts/Blast-Circuit-windows-x64-updater-details/**/helper-error.txt
            artifacts/Blast-Circuit-windows-x64-updater-details/**/setup.log
            artifacts/Blast-Circuit-windows-x64-updater-details/**/health.json
            artifacts/Blast-Circuit-windows-x64-Setup.exe
            artifacts/Blast-Circuit-windows-x64-Setup.exe.sha256
            artifacts/Blast-Circuit-windows-x64-download.json
            artifacts/Blast-Circuit-windows-x64-regression-details/**/summary.json
            artifacts/Blast-Circuit-windows-x64-regression-details/**/runner-summary.json
            artifacts/Blast-Circuit-windows-x64-regression-details/**/graphics-preparation.json
            artifacts/Blast-Circuit-windows-x64-regression-details/**/progress.json
            artifacts/*-regression-details/**/peer-capacity-diagnostics.json
            artifacts/*-regression-details/**/display-restart.json
            artifacts/Blast-Circuit-windows-x64-regression-details/**/junit.xml
            artifacts/Blast-Circuit-windows-x64-regression-details/**/runtime.log
            artifacts/Blast-Circuit-windows-x64-regression-details/**/*.png
          retention-days: 14
          if-no-files-found: error

  linux-package:
    name: Trusted linux-x64 package
    needs: public
    if: needs.public.outputs.runtime == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KERNEL_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch pinned private dependency
        env:
          KERNEL_REPOSITORY: ${{ secrets.KERNEL_REPOSITORY }}
          KERNEL_READ_TOKEN: ${{ secrets.KERNEL_READ_TOKEN }}
          KERNEL_DEPLOY_KEY: ${{ secrets.KERNEL_DEPLOY_KEY }}
          GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python3 tools/ci/bootstrap_kernel.py
      - run: python3 tools/ci/install_godot.py --destination "$RUNNER_TEMP/godot" --templates
      - run: python3 tools/packaging/package-desktop.py --target linux-x64
      - run: python3 tools/packaging/package-update-fixture.py --target linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Blast-Circuit-linux-x64
          path: |
            artifacts/Blast-Circuit-linux-x64.zip
            artifacts/Blast-Circuit-linux-x64.zip.sha256
            artifacts/Blast-Circuit-linux-x64-metadata.json
            artifacts/Blast-Circuit-linux-x64-update-fixture.zip
            artifacts/Blast-Circuit-linux-x64-update-fixture.zip.sha256
          retention-days: 14
          if-no-files-found: error

  linux-smoke:
    name: Exported linux-x64 smoke
    needs: [linux-package, managed]
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-linux-x64
          path: artifacts
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          path: artifacts
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools fuse3 xvfb openbox pulseaudio mesa-vulkan-drivers
      - run: python3 tools/packaging/package-download.py --target linux-x64
      - run: dotnet run --project tests/Bomber.DesktopUpdate.Tests -m:1
      - run: python3 tools/packaging/verify-desktop.py --target linux-x64
      - run: python3 tools/packaging/package-update-fixture.py --target linux-x64 --unpack
      - run: python3 tools/packaging/package-download.py --target linux-x64 --directory artifacts/update-fixture
      - run: python3 tools/packaging/linux-desktop.py -- python3 tools/packaging/verify-desktop-update.py --target linux-x64
      - run: python3 tools/packaging/linux-desktop.py -- python3 tools/packaging/startup-desktop.py --target linux-x64
      - run: python3 tools/packaging/linux-desktop.py -- python3 tools/packaging/verify-desktop.py --target linux-x64 --graphical --software-renderer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Blast-Circuit-linux-x64-smoke
          path: |
            artifacts/Blast-Circuit-linux-x64-smoke.json
            artifacts/Blast-Circuit-linux-x64-graphical.json
            artifacts/Blast-Circuit-linux-x64-startup.json
            artifacts/Blast-Circuit-linux-x64-startup-details/**/runtime.log
            artifacts/Blast-Circuit-linux-x64-startup-details/**/*.png
            artifacts/Blast-Circuit-linux-x64-updater-tests.json
            artifacts/Blast-Circuit-linux-x64-updater-details/**/runtime.log
            artifacts/Blast-Circuit-linux-x64-updater-details/**/summary.json
            artifacts/Blast-Circuit-linux-x64-updater-details/**/old-launch.log
            artifacts/Blast-Circuit-linux-x64-updater-details/**/restored-gameplay.log
            artifacts/Blast-Circuit-linux-x64-updater-details/**/helper-error.txt
            artifacts/Blast-Circuit-linux-x64-updater-details/**/health.json
            artifacts/Blast-Circuit-linux-x64.AppImage
            artifacts/Blast-Circuit-linux-x64.AppImage.sha256
            artifacts/Blast-Circuit-linux-x64-download.json
            artifacts/Blast-Circuit-linux-x64-regression-details/**/summary.json
            artifacts/Blast-Circuit-linux-x64-regression-details/**/runner-summary.json
            artifacts/Blast-Circuit-linux-x64-regression-details/**/graphics-preparation.json
            artifacts/Blast-Circuit-linux-x64-regression-details/**/progress.json
            artifacts/*-regression-details/**/peer-capacity-diagnostics.json
            artifacts/*-regression-details/**/display-restart.json
            artifacts/Blast-Circuit-linux-x64-regression-details/**/junit.xml
            artifacts/Blast-Circuit-linux-x64-regression-details/**/runtime.log
            artifacts/Blast-Circuit-linux-x64-regression-details/**/*.png
          retention-days: 14
          if-no-files-found: error

  mac-regression:
    name: Exported macos-arm64 regression
    needs: [package, managed]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-macos-arm64-ad-hoc
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          path: artifacts
      - run: python3 tools/packaging/macos-test-display.py
      - run: python3 tools/packaging/verify-mac-archive.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Blast-Circuit-macos-arm64-regression
          path: |
            artifacts/Blast-Circuit-macos-arm64-regression.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/summary.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/runner-summary.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/progress.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/graphics-preparation.json
            artifacts/*-regression-details/**/peer-capacity-diagnostics.json
            artifacts/*-regression-details/**/display-restart.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/runtime.log
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/*.png
          retention-days: 14
          if-no-files-found: warn

  crossplay:
    name: Cross-platform Quick Play
    needs: [windows-smoke, linux-smoke, mac-regression]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/crossplay.yml
    with:
      mode: verification
      revision: ${{ github.sha }}
