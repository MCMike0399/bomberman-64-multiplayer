name: Production Quick Play verification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-quick-play-v0450
  cancel-in-progress: false

jobs:
  clients:
    name: Client ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: runner.os == 'macOS'
        run: python3 tools/packaging/macos-test-display.py
      - if: runner.os == 'Windows'
        run: ./tools/packaging/windows-test-desktop.ps1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse3 xvfb openbox pulseaudio mesa-vulkan-drivers
      - name: Verify and download only the published signed installers
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/ci/production_crossplay.py prepare --target "$TARGET"
      - name: Hold until every peer client runner has started
        # Queue delay is not readiness: start each game only once all three
        # runners are live, so the in-game ready barrier measures rendering.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/crossplay.py wait-jobs --jobs "Client windows-x64" "Client linux-x64" "Client macos-arm64" --timeout 1800
      - name: Install the real download and warm its actual renderer
        env:
          TARGET: ${{ matrix.target }}
          BLAST_QA_WINDOWS_DRIVER: ${{ runner.os == 'Windows' && runner.environment == 'github-hosted' && 'd3d12' || '' }}
        shell: bash
        run: python tools/ci/production_crossplay.py start --target "$TARGET" --output "artifacts/crossplay-$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crossplay-ready-${{ matrix.target }}-a${{ github.run_attempt }}
          path: artifacts/crossplay-${{ matrix.target }}/crossplay-ready.json
          retention-days: 2
          if-no-files-found: error
      - name: Release all three already-rendering clients together
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/crossplay.py wait --names crossplay-ready-windows-x64-a${{ github.run_attempt }} crossplay-ready-linux-x64-a${{ github.run_attempt }} crossplay-ready-macos-arm64-a${{ github.run_attempt }} --timeout 300
      - name: Require shared countdown, real minute, match and accepted actions
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/ci/production_crossplay.py release --target "$TARGET" --output "artifacts/crossplay-$TARGET"
      - name: Wait for the immutable local witness before publishing the final barrier
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/ci/production_crossplay.py committed --target "$TARGET" --output "artifacts/crossplay-$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crossplay-actions-${{ matrix.target }}-a${{ github.run_attempt }}
          path: |
            artifacts/crossplay-${{ matrix.target }}/crossplay-actions.json
            artifacts/crossplay-${{ matrix.target }}/crossplay-three-os-countdown.png
            artifacts/crossplay-${{ matrix.target }}/crossplay-roster-reset.png
            artifacts/crossplay-${{ matrix.target }}/crossplay-three-os-gameplay.png
          retention-days: 2
          if-no-files-found: error
      - name: Hold every original participant until all action/admission witnesses finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/crossplay.py wait --names crossplay-actions-windows-x64-a${{ github.run_attempt }} crossplay-actions-linux-x64-a${{ github.run_attempt }} crossplay-actions-macos-arm64-a${{ github.run_attempt }} --timeout 120
      - name: Finish and validate the rendered game receipt
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/ci/production_crossplay.py finish --target "$TARGET" --output "artifacts/crossplay-$TARGET"
      - name: Close only this client's owned test processes
        if: always()
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/ci/production_crossplay.py stop --target "$TARGET" --output "artifacts/crossplay-$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: crossplay-${{ matrix.target }}-a${{ github.run_attempt }}
          path: |
            artifacts/crossplay-${{ matrix.target }}/production-provenance.json
            artifacts/crossplay-${{ matrix.target }}/crossplay-receipt.json
            artifacts/crossplay-${{ matrix.target }}/crossplay.json
            artifacts/crossplay-${{ matrix.target }}/crossplay-committed.json
            artifacts/crossplay-${{ matrix.target }}/crossplay-progress.json
            artifacts/crossplay-${{ matrix.target }}/crossplay-failure.json
            artifacts/crossplay-${{ matrix.target }}/summary.json
            artifacts/crossplay-${{ matrix.target }}/runtime.log
            artifacts/crossplay-${{ matrix.target }}/launcher.log
            artifacts/crossplay-${{ matrix.target }}/phases.json
            artifacts/crossplay-${{ matrix.target }}/trace.jsonl
            artifacts/crossplay-${{ matrix.target }}/*.png
          retention-days: 14
          if-no-files-found: warn
      # Separate root: mixing windows-audio into crossplay-<target> nested the
      # receipt one directory deeper and broke parity aggregation (run 40737870206).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Windows'
        with:
          name: crossplay-audio-${{ matrix.target }}-a${{ github.run_attempt }}
          path: artifacts/windows-audio/*.json
          retention-days: 14
          if-no-files-found: warn

  parity:
    name: Three-platform parity
    needs: clients
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crossplay-windows-x64-a${{ github.run_attempt }}
          path: artifacts/windows-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crossplay-linux-x64-a${{ github.run_attempt }}
          path: artifacts/linux-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crossplay-macos-arm64-a${{ github.run_attempt }}
          path: artifacts/macos-arm64
      - run: python3 tools/ci/production_crossplay.py aggregate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-crossplay-receipt
          path: artifacts/production-crossplay-receipt.json
          retention-days: 14
          if-no-files-found: error
