name: Native desktop diagnostics

on:
  # A conflicted isolated QA PR cannot receive pull_request workflows. Arm only
  # one exact runner SHA; ordinary QA pushes and main releases do not opt in.
  push:
    branches: [qa/three-platform-release]
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  actions: read

jobs:
  windows-audio:
    if: github.event.label.name == 'windows-audio-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: ./tools/packaging/windows-test-desktop.ps1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-candidate-inputs
          run-id: ${{ vars.BLAST_DIAGNOSTIC_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts
      - run: python tools/packaging/startup-desktop.py --target windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-audio-diagnostics
          path: |
            artifacts/windows-audio
            artifacts/*-startup.json
            artifacts/*-startup-details/**/runtime.log
            artifacts/*-startup-details/**/*.png
          retention-days: 14
          if-no-files-found: warn

  linux-process-identity:
    if: github.event.label.name == 'linux-update-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/Bomber.DesktopUpdate.Tests -m:1
      - name: Require kernel birth identities with parentheses and spaces in process names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,subprocess
          root=Path('tests/Bomber.DesktopUpdate.Tests/bin/Debug/net10.0').resolve()
          executable=root/'identity ) probe'
          shutil.copy2(root/'Bomber.DesktopUpdate.Tests',executable)
          subprocess.run([str(executable)],check=True,timeout=60)
          PY

  windows-updater-locks:
    if: github.event.label.name == 'windows-update-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Prove the retained Windows sharing regression on the old transaction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('src/Bomber.Client/Updates/DesktopUpdateTransaction.cs')
          current = path.read_bytes()
          try:
              path.write_bytes(subprocess.check_output(['git', 'show', 'f3a8751:src/Bomber.Client/Updates/DesktopUpdateTransaction.cs']))
              result = subprocess.run(['dotnet', 'run', '--project', 'tests/Bomber.DesktopUpdate.Tests', '-m:1'], capture_output=True, text=True, timeout=60)
              output = result.stdout + result.stderr
              print(output)
              assert result.returncode != 0 and 'TRANSACTION_FAILURE System.IO.IOException' in output and 'DesktopUpdateTransaction.Move' in output, 'Old transaction did not reproduce the sharing failure'
          finally:
              path.write_bytes(current)
          PY
      - name: Require the same Windows sharing and rollback regression to pass
        run: dotnet run --project tests/Bomber.DesktopUpdate.Tests -m:1
      - name: Compare old and current uninstall coverage for update-added files
        run: python tools/packaging/windows-installer-probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-installer-probe
          path: artifacts/windows-installer-probe
          retention-days: 14
          if-no-files-found: warn

  windows-peer:
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'desktop-diagnostics')
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-candidate-inputs
          run-id: ${{ vars.BLAST_DIAGNOSTIC_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-windows-x64
          run-id: ${{ vars.BLAST_DIAGNOSTIC_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts
      - run: python tools/ci/peer_diagnostics.py windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-peer-diagnostics
          path: |
            artifacts/native-peer-diagnostics/peer-diagnostic.json
            artifacts/native-peer-diagnostics/attempt-*/*/summary.json
            artifacts/native-peer-diagnostics/attempt-*/*/runner-summary.json
            artifacts/native-peer-diagnostics/attempt-*/*/runtime.log
          retention-days: 7
          if-no-files-found: warn

  windows-online:
    # Focused graphical online journeys on WARP for exact private-draft payloads.
    # vars.BLAST_DIAGNOSTIC_SHAS lists payload revisions, e.g. a retained failing
    # control and a diagnostic build; runner code is this PR head for both.
    if: >-
      vars.BLAST_DIAGNOSTIC_SHAS != '[]' &&
      ((github.event_name == 'push' && vars.BLAST_DIAGNOSTIC_RUNNER_SHA == github.sha) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'windows-online-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        payload: ${{ fromJSON(vars.BLAST_DIAGNOSTIC_SHAS) }}
    runs-on: windows-2025
    timeout-minutes: 200
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Download the exact private payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAYLOAD: ${{ matrix.payload }}
        shell: bash
        run: gh release download "qa-desktop-$PAYLOAD" --dir artifacts -p 'Blast-Circuit-windows-x64.zip*' -p 'Blast-Circuit-windows-x64-metadata.json' -p 'Blast-Circuit-server-dotnet10.zip*' -p 'server-build-metadata.json'
      - run: ./tools/packaging/windows-test-desktop.ps1
      - run: python tools/packaging/package-download.py --target windows-x64
      - name: Run the explicitly selected focused journeys
        env:
          BLAST_DIAGNOSTIC_SCENARIOS: ${{ vars.BLAST_DIAGNOSTIC_SCENARIOS || '["network","peer-rooms","peer-link-recovery"]' }}
        run: python tools/ci/online_diagnostics.py windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-online-${{ matrix.payload }}
          path: |
            artifacts/online-diagnostics/online-diagnostic.json
            artifacts/online-diagnostics/*/server*.log
            artifacts/online-diagnostics/*/*/summary.json
            artifacts/online-diagnostics/*/*/runner-summary.json
            artifacts/online-diagnostics/*/*/trace.jsonl
            artifacts/online-diagnostics/*/*/runtime.log
            artifacts/online-diagnostics/*/*/*-diagnostics.json
            artifacts/online-diagnostics/*/*/peer-link-recovery.json
            artifacts/online-diagnostics/*/*/leaf-memory.json
            artifacts/online-diagnostics/*/*/*.png
          retention-days: 7
          if-no-files-found: warn

  crossplay-inputs:
    # Diagnostic three-OS match from one exact private draft (vars.BLAST_CROSSPLAY_SHA),
    # independent of graphical tours. Never a promotion receipt.
    if: >-
      (github.event_name == 'push' && vars.BLAST_DIAGNOSTIC_RUNNER_SHA == github.sha) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'crossplay-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.payload.outputs.revision }}
    steps:
      - id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAYLOAD: ${{ vars.BLAST_CROSSPLAY_SHA }}
        run: |
          gh release download "qa-desktop-$PAYLOAD" --dir artifacts
          echo "revision=$PAYLOAD" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-candidate-inputs
          path: artifacts
          retention-days: 2
          if-no-files-found: error

  crossplay-prepare:
    needs: crossplay-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.crossplay-inputs.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-candidate-inputs
          path: artifacts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools fuse3
      - env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python tools/packaging/package-download.py --target "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: download-${{ matrix.target }}
          path: |
            artifacts/Blast-Circuit-${{ matrix.target }}-Setup.exe
            artifacts/Blast-Circuit-${{ matrix.target }}-Setup.exe.sha256
            artifacts/Blast-Circuit-${{ matrix.target }}.AppImage
            artifacts/Blast-Circuit-${{ matrix.target }}.AppImage.sha256
            artifacts/Blast-Circuit-${{ matrix.target }}-download.json
          retention-days: 2
          if-no-files-found: error

  crossplay:
    name: Diagnostic cross-platform Quick Play
    needs: [crossplay-inputs, crossplay-prepare]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/crossplay.yml
    with:
      mode: candidate
      revision: ${{ needs.crossplay-inputs.outputs.revision }}
      runner-revision: ${{ github.event.pull_request.head.sha || github.sha }}

  mac-display:
    if: github.event.label.name == 'mac-display-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 tools/packaging/macos-test-display.py
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-candidate-inputs
          run-id: ${{ vars.BLAST_DIAGNOSTIC_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts
      - run: python3 tools/playtest/diagnose_display.py
      - if: always()
        run: python3 tools/packaging/macos-test-display.py --stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mac-test-display-diagnostics
          path: |
            artifacts/macos-test-display/display.json
            artifacts/macos-test-display/runtime.log
            artifacts/display-diagnostic/diagnostic.json
            artifacts/display-diagnostic/launcher.log
            artifacts/display-diagnostic/*-sample.txt
            artifacts/display-diagnostic/**/summary.json
            artifacts/display-diagnostic/**/runner-summary.json
            artifacts/display-diagnostic/**/runtime.log
            artifacts/display-diagnostic/**/*.png
            artifacts/Blast-Circuit-macos-arm64-regression.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/summary.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/runner-summary.json
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/runtime.log
            artifacts/Blast-Circuit-macos-arm64-regression-details/**/*.png
          retention-days: 7
          if-no-files-found: warn
