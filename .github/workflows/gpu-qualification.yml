name: Builder OIDC proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sancus-builder-controller
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/builder-controller.yml
