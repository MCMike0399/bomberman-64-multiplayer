name: Publish verified update

on:
  workflow_run:
    workflows: [Verification]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    if: >-
      vars.AUTO_RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import sys; sys.path.insert(0,"tools/ci"); from release_identity import check_exports; print(check_exports()["version"])')
          python3 tools/ci/promote_release.py --check-only --run-id "$RUN_ID" --version "$version" --expected-sha "$EXPECTED_SHA"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: candidate
    if: needs.candidate.outputs.exists == 'false'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/promote.yml
    with:
      run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      version: ${{ needs.candidate.outputs.version }}
      publish: true
    secrets:
      BLAST_UPDATE_SIGNING_KEY: ${{ secrets.BLAST_UPDATE_SIGNING_KEY }}
      BLAST_RELEASE_SERVER_URLS: ${{ secrets.BLAST_RELEASE_SERVER_URLS }}
      BLAST_RELEASE_PLACEMENTS: ${{ secrets.BLAST_RELEASE_PLACEMENTS }}
