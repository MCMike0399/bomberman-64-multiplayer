name: Publish verified update

on:
  workflow_run:
    workflows: [Verification]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-verified-update
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.AUTO_RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish only the successful run's signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          BLAST_UPDATE_SIGNING_KEY: ${{ secrets.BLAST_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import pathlib,re; print(re.search(r"application/short_version=\"([0-9.]+)\"", pathlib.Path("export_presets.cfg").read_text())[1])')
          python3 tools/ci/promote_release.py --check-only --run-id "$RUN_ID" --version "$version" --expected-sha "$EXPECTED_SHA"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Version already has a release; preserving it."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/blast-update-signing.pem"
          trap 'rm -f "$key"' EXIT
          test -n "$BLAST_UPDATE_SIGNING_KEY"
          printf '%s\n' "$BLAST_UPDATE_SIGNING_KEY" > "$key"
          python3 tools/ci/promote_release.py --run-id "$RUN_ID" --version "$version" --expected-sha "$EXPECTED_SHA" --signing-key "$key" --publish
