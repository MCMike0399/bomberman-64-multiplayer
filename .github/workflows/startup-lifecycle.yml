name: Frozen native startup and shutdown diagnostics
on:
  push:
    branches: [qa/three-platform-release]
permissions:
  contents: read
  actions: read
jobs:
  native:
    name: Shutdown controls (${{ matrix.target }})
    if: vars.BLAST_STARTUP_RUNNER_SHA == github.sha
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download exact frozen archive and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          PAYLOAD: ${{ vars.BLAST_STARTUP_PAYLOAD_SHA }}
        shell: bash
        run: |
          python - <<'PY'
          import os,re,subprocess
          sha,target=os.environ['PAYLOAD'],os.environ['TARGET']
          assert re.fullmatch('[0-9a-f]{40}',sha)
          subprocess.run(['gh','release','download','qa-desktop-'+sha,'--dir','artifacts',
                          '-p','Blast-Circuit-'+target+'.zip*','-p','Blast-Circuit-'+target+'-metadata.json'],check=True,timeout=300)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mesh-tested-download-${{ matrix.target }}
          run-id: ${{ vars.BLAST_STARTUP_DOWNLOAD_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse3 xvfb openbox pulseaudio mesa-vulkan-drivers gdb
      - if: runner.os == 'Windows'
        run: ./tools/packaging/windows-test-desktop.ps1
      - name: Compare exit boundaries and retain live stacks before killing timed-out processes
        env:
          TARGET: ${{ matrix.target }}
          PAYLOAD: ${{ vars.BLAST_STARTUP_PAYLOAD_SHA }}
        shell: bash
        run: |
          python - <<'PY'
          import os,subprocess,sys
          command=[sys.executable,'tools/ci/startup_lifecycle.py','--target',os.environ['TARGET'],
                   '--expected-revision',os.environ['PAYLOAD'],'--output','artifacts/startup-lifecycle-'+os.environ['TARGET']]
          if os.environ['TARGET']=='linux-x64':command=[sys.executable,'tools/packaging/linux-desktop.py','--',*command]
          subprocess.run(command,check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: startup-lifecycle-${{ matrix.target }}
          path: |
            artifacts/startup-lifecycle-${{ matrix.target }}/startup-lifecycle.json
            artifacts/startup-lifecycle-${{ matrix.target }}/*/runtime.log
            artifacts/startup-lifecycle-${{ matrix.target }}/*/godot.log
            artifacts/startup-lifecycle-${{ matrix.target }}/*/preferences.cfg
            artifacts/startup-lifecycle-${{ matrix.target }}/*/menu.png
            artifacts/startup-lifecycle-${{ matrix.target }}/*/native-stack.log
            artifacts/startup-lifecycle-${{ matrix.target }}/*/native.dmp
            artifacts/startup-lifecycle-${{ matrix.target }}/*/dump-collector.log
          retention-days: 14
          if-no-files-found: warn
