name: "[DIAG, do not merge] Windows P2P Connecting stall"

# Diagnostic-only branch workflow. Triggers only on pushes to diag/windows-p2p-stall; it reads the exact
# trusted-main Verification artifacts for 3ed682b and never publishes, promotes or alters variables.
on:
  push:
    branches: [diag/windows-p2p-stall]

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '41122669402'

jobs:
  windows-p2p:
    strategy:
      fail-fast: false
      matrix:
        variant: [verbose, novswitch-verbose]
        shard: ['4', '5', '6', '7', '8', '9']
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-windows-x64-download
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Blast-Circuit-server-dotnet10
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Repeat native peer checks
        env:
          VARIANT: ${{ matrix.variant }}
          SHARD: ${{ matrix.shard }}
        run: python tools/ci/p2p_stall_diag.py --variant $env:VARIANT --shard $env:SHARD --ice 150 --capacity 2 --keep-passes 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p2p-stall-${{ matrix.variant }}-${{ matrix.shard }}
          path: artifacts/p2p-stall
          retention-days: 7
          if-no-files-found: warn
