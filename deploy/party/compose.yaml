name: blast-circuit
services:
  server:
    image: blast-circuit-server:${BLAST_VERSION:-local}
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BLAST_BIND:-127.0.0.1}:${BLAST_PORT:-18496}:8080"
    environment:
      Kernel__Role: worker
      Kernel__NodeId: blast-party
      Kernel__Seed: "false"
      Realtime__Servers__0__Id: blast-party
      Realtime__Servers__0__Region: home
      Realtime__Servers__0__MaxLobbies: "8"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 3 http://127.0.0.1:8080/realtime/v1/games | grep -q '\"blast\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
