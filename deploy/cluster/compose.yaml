name: blast-cluster
services:
  server:
    image: ${BLAST_IMAGE:?Use the verified release image}
    restart: unless-stopped
    init: true
    cpus: ${BLAST_CPUS:-1.0}
    cpu_shares: 128
    mem_limit: ${BLAST_MEMORY:-384m}
    memswap_limit: ${BLAST_MEMORY:-384m}
    pids_limit: 256
    ports:
      - "${BLAST_BIND:-127.0.0.1}:${BLAST_PORT:-18496}:8080"
    extra_hosts:
      - "raspberrypi:${BLAST_PI_IP:?Resolve the current Pi tailnet address}"
    volumes:
      - ./runtime:/app:ro
      - ./plugins/Realtime.Redis:/app/plugins/Realtime.Redis:ro
      - ./plugins/Blast.Cluster:/app/plugins/Blast.Cluster:ro
      - ./admission:/run/blast-admission:ro
    environment:
      Kernel__Role: worker
      Kernel__NodeId: ${BLAST_NODE:?Unique node ID}
      Kernel__Seed: "false"
      Kernel__PluginsDirectory: /app/plugins
      Realtime__Servers__0__Id: ${BLAST_NODE}
      Realtime__Servers__0__Region: ${BLAST_REGION:?Node capacity region}
      Realtime__Servers__0__MaxLobbies: ${BLAST_MAX_LOBBIES:-2}
      Realtime__Servers__0__PublicUrl: https://blast.burbuja-lab.dev/nodes/${BLAST_ROUTE:?Public node route}
      Realtime__Guests__SigningKey: ${BLAST_SIGNING_KEY:?Shared private guest signing key}
      Realtime__Redis__Configuration: ${BLAST_REDIS:?Private authenticated backplane connection}
      Realtime__Redis__KeyPrefix: "{blast-circuit}:"
      Realtime__Placement: blast-primary-fallback
      Realtime__EnableWebSocketCompression: "true"
      BlastCluster__ServerOrder__0: blast-pi
      BlastCluster__ServerOrder__1: blast-divemac
      BlastCluster__AdmissionFile: /run/blast-admission/placement.json
      Auth__ApiKeys__0__Key: ${BLAST_OPERATOR_KEY:?Private operator key}
      Auth__ApiKeys__0__PrincipalId: blast-operator
      Auth__ApiKeys__0__Roles__0: Owner
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 3 http://127.0.0.1:8080/realtime/v1/games | grep -q '\"blast\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
